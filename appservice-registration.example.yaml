# MatrixMigrate Application Service Registration
#
# This file must be registered with your Synapse homeserver to enable
# message import with original timestamps and room/space creator + alias (preserve_owner_and_alias).
#
# Steps:
# 1. Generate tokens (openssl rand -hex 32)
# 2. Copy this file to your Synapse server (e.g., /etc/matrix-synapse/matrixmigrate.yaml)
# 3. Replace example.com with your homeserver domain in the namespace regexes below
# 4. Add to homeserver.yaml: app_service_config_files: ["/etc/matrix-synapse/matrixmigrate.yaml"]
# 5. Restart Synapse
# 6. Add the as_token to your MatrixMigrate config.yaml

id: matrixmigrate
url: null  # No callback URL needed - this is outbound-only

# Generate these tokens with: openssl rand -hex 32
as_token: "REPLACE_WITH_GENERATED_TOKEN"
hs_token: "REPLACE_WITH_GENERATED_TOKEN"

# The localpart of the user the AS will masquerade as
sender_localpart: matrixmigrate

rate_limited: false

# Required for message import (user_id) and for room creator + alias when preserve_owner_and_alias is enabled.
# Replace example.com with your homeserver domain.
namespaces:
  users:
    - exclusive: false
      regex: "@.*:example\\.com"
  rooms:
    - exclusive: false
      regex: "!.*:example\\.com"
  aliases:
    - exclusive: true
      regex: "#.*:example\\.com"
