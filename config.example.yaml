# MatrixMigrate Configuration Example
# Copy this file to config.yaml and update with your settings

# Language setting (default: en)
# Supported: en, tr
language: en

# Mattermost server configuration
mattermost:
  ssh:
    host: "mattermost.example.com"
    port: 22
    user: "root"
    
    # Authentication: Use ONE of the following options:
    
    # Option 1: SSH Key (recommended)
    key_path: "~/.ssh/id_rsa"
    # passphrase_env: "SSH_KEY_PASSPHRASE"  # Optional: if key is encrypted
    
    # Option 2: Password authentication
    # password_env: "MM_SSH_PASSWORD"  # Env var containing SSH password
  
  # Path to Mattermost config.json on remote server
  # Database credentials will be read from this file automatically!
  config_path: "/opt/mattermost/config/config.json"
  
  # Optional: Manual database override (if you don't want auto-detection)
  # database:
  #   host: "localhost"
  #   port: 5432
  #   name: "mattermost"
  #   user: "mmuser"
  #   password_env: "MM_DB_PASSWORD"
  
  # File attachment migration settings
  files:
    # Migration mode:
    #   "link"   - Keep S3/public URLs in messages (fastest, requires S3 public access)
    #   "upload" - Download and re-upload files to Matrix (slowest, most portable)
    #   "skip"   - Don't migrate files (fastest, messages only)
    mode: "link"
    
    # S3 public URL prefix for direct linking
    # Files will be accessible at: {s3_public_url}/{file_path}
    # Example: https://s3.example.com/mattermost-bucket
    s3_public_url: "https://s3.example.com/mattermost-bucket"
    
    # Local data path (if using local file storage instead of S3)
    # local_data_path: "/opt/mattermost/data"
    
    # Maximum file size to upload to Matrix (in MB)
    # Files larger than this will be linked instead of uploaded
    # Only applies when mode is "upload"
    max_upload_size_mb: 50

# Matrix Synapse server configuration
matrix:
  ssh:
    host: "matrix.example.com"
    port: 22
    user: "root"
    
    # Authentication: Use ONE of the following options:
    
    # Option 1: SSH Key (recommended)
    key_path: "~/.ssh/id_rsa"
    # passphrase_env: "SSH_KEY_PASSPHRASE"  # Optional: if key is encrypted
    
    # Option 2: Password authentication
    # password_env: "MX_SSH_PASSWORD"  # Env var containing SSH password
  
  api:
    # After SSH tunnel, API will be available at localhost
    base_url: "http://localhost:8008"
    # Synapse API port on the remote server (default: 8008)
    # Change this if Synapse listens on a different port
    port: 8008
    # Optional: Use existing admin token instead of login
    # admin_token_env: "MATRIX_ADMIN_TOKEN"
  
  # Login with admin username/password (recommended)
  # The tool will automatically get an access token
  auth:
    username: "admin"
    password_env: "MATRIX_ADMIN_PASSWORD"
  
  # Your Matrix homeserver domain (e.g., for @user:example.com)
  homeserver: "example.com"
  
  # Rate limiting configuration (adjust if you get too many 429 errors)
  rate_limit:
    # Requests per second (lower = slower but safer, 0 = no limit)
    # Default: 5.0 (200ms between requests)
    requests_per_second: 5.0
    
    # Maximum retries when rate limited (429 error)
    # Default: 5
    max_retries: 5
    
    # Base delay in milliseconds for exponential backoff
    # Actual delay: base_delay * 2^retry_count (e.g., 2s, 4s, 8s, 16s, 32s)
    # Default: 2000 (2 seconds)
    retry_base_delay_ms: 2000
  
  # Application Service configuration (required for message import with timestamps and room creator/alias)
  # See appservice-registration.example.yaml and README for setup instructions.
  # For preserve_owner_and_alias you must set in the AS registration:
  #   namespaces.aliases: [ { exclusive: true, regex: "#.*:your\\.domain\\.com" } ]
  # (replace your.domain.com with your homeserver domain)
  appservice:
    # Enable Application Service mode for message import and for room/space creator + alias
    # This allows importing messages with their original timestamps and creating rooms as the actual owner
    enabled: false
    
    # Environment variable containing the AS token
    # Generate with: openssl rand -hex 32
    as_token_env: "MATRIX_AS_TOKEN"
    
    # Environment variable containing the HS token (optional)
    # hs_token_env: "MATRIX_HS_TOKEN"

  # Room/space import: preserve Mattermost owner and set local room address (team+name)
  import:
    # When true, rooms and spaces get: owner from channel/team creator_id (or fallback), alias = team+name
    preserve_owner_and_alias: false
    # When true, users are added to rooms/spaces via Synapse admin API (joined directly, no invite to accept).
    # Use for migrations where users are already members. Default: false (invite; users must accept).
    # force_join: false
    # Public room join rules (who can join public Mattermost channels in Matrix). Default: "space_members"
    #   "space_members" - Only members of the parent space/team can join (restricted join rule; recommended).
    #   "public"        - Anyone can join (leave default Matrix join rule).
    # public_room_join_rules: "space_members"
    # When creator_id is empty, use this Matrix username (localpart only, e.g. "admin" -> @admin:domain).
    # If this user does not exist, the admin account (auth.username) is used.
    # fallback_room_creator: "admin"
    # For the room creator to be the actual user (not the AS admin), enable appservice above and set as_token_env.
    # In your Application Service registration you must include an alias namespace, e.g.:
    #   aliases: [ { exclusive: true, regex: "#.*:domain\\.com" } ]
    # If you get M_EXCLUSIVE, the tool will retry without alias so migration continues.

  # Matrix Authentication Service (MAS) - use MAS for user creation instead of Synapse
  # When enabled, users are created via MAS Admin API so they can log in via SSO/OAuth
  # without "Localpart not available" errors. Requires MAS with admin API enabled.
  mas:
    enabled: false
    
    # MAS API base URL (e.g. http://mas.example.com:8080 or http://localhost:8080 if tunneled)
    # endpoint: "http://mas.example.com:8080"
    
    # OAuth client credentials - must be an admin client in MAS policy.data.admin_clients
    # client_id_env: "MAS_CLIENT_ID"
    # client_secret_env: "MAS_CLIENT_SECRET"

# Data storage paths
data:
  assets_dir: "./data/assets"
  mappings_dir: "./data/mappings"
  state_file: "./data/state.json"


# ========================================
# SYNAPSE RATE LIMITING - IMPORTANT!
# ========================================
#
# If you're getting too many 429 (rate limit) errors during migration,
# you can TEMPORARILY disable rate limiting on your Synapse server:
#
# Add this to your homeserver.yaml (Synapse config):
#
#   rc_message:
#     per_second: 0
#     burst_count: 0
#   rc_registration:
#     per_second: 0
#     burst_count: 0
#   rc_login:
#     address:
#       per_second: 0
#       burst_count: 0
#     account:
#       per_second: 0
#       burst_count: 0
#     failed_attempts:
#       per_second: 0
#       burst_count: 0
#   rc_admin_redaction:
#     per_second: 0
#     burst_count: 0
#   rc_joins:
#     local:
#       per_second: 0
#       burst_count: 0
#     remote:
#       per_second: 0
#       burst_count: 0
#   rc_invites:
#     per_room:
#       per_second: 0
#       burst_count: 0
#     per_user:
#       per_second: 0
#       burst_count: 0
#
# IMPORTANT: Remember to restart Synapse and re-enable rate limiting
# after the migration is complete for security!
#
# To restart Synapse:
#   systemctl restart matrix-synapse  (or your docker command)
#

