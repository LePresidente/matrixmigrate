# MatrixMigrate Configuration Example
# Copy this file to config.yaml and update with your settings
#
# This file holds no secrets. Every credential is referenced by the *name* of an
# environment variable (the `*_env` keys below); the value itself lives in your
# environment. See .env.example for the matching variables.

# Language setting (default: en)
# Supported: en, tr
language: en

# Enable debug-level logging to migration.log (function names, room/space IDs) to trace errors
# Set to true when diagnosing "admin in room", "link room to space", or membership failures
debug: false

# Mattermost server configuration
mattermost:
  # Leave `ssh` empty to use direct mode: the database is reached from this machine
  # without a tunnel. Use it when matrixmigrate runs on the Mattermost server itself, or
  # against a dump restored locally. Combine with a manual `database` block below, since
  # there is then no remote config.json to read credentials from.
  #   ssh: {}
  ssh:
    host: "mattermost.example.com"
    port: 22
    user: "root"
    
    # Authentication: Use ONE of the following options:
    
    # Option 1: SSH Key (recommended)
    key_path: "~/.ssh/id_rsa"
    # passphrase_env: "SSH_KEY_PASSPHRASE"  # Optional: if key is encrypted
    
    # Option 2: Password authentication
    # password_env: "MM_SSH_PASSWORD"  # Env var containing SSH password
  
  # Path to Mattermost config.json on remote server
  # Database credentials will be read from this file automatically!
  config_path: "/opt/mattermost/config/config.json"
  
  # Optional: Manual database override (if you don't want auto-detection)
  # database:
  #   host: "localhost"
  #   port: 5432
  #   name: "mattermost"
  #   user: "mmuser"
  #   password_env: "MM_DB_PASSWORD"
  #   # TLS for the database connection: "disable", "require", "verify-ca" or "verify-full".
  #   # Left unset, a connection that stays on this machine - a unix socket, 127.0.0.1, or
  #   # the local end of the SSH tunnel - uses "disable", and anything remote uses "require"
  #   # so the password and the message history do not cross the network in cleartext. In
  #   # direct mode with auto-detection, whatever Mattermost's own DataSource asks for wins
  #   # over that default. "prefer" and "allow" are not accepted - the driver rejects them.
  #   ssl_mode: "require"

  # Optional: Mattermost usernames to ignore during import (case-insensitive).
  # Useful for skipping bot/service accounts.
  # ignored_users:
  #   - "my-bot"
  #   - "jira"
  
  # File attachment migration settings
  files:
    # Migration mode:
    #   "link"   - Keep S3/public URLs in messages (fastest, requires S3 public access)
    #   "upload" - Download and re-upload files to Matrix (slowest, most portable)
    #   "skip"   - Don't migrate files (fastest, messages only)
    mode: "link"
    
    # S3 public URL prefix for direct linking
    # Files will be accessible at: {s3_public_url}/{file_path}
    # Example: https://s3.example.com/mattermost-bucket
    s3_public_url: "https://s3.example.com/mattermost-bucket"
    
    # Local data path (if using local file storage instead of S3)
    # Can be either:
    # - local path on the machine running matrixmigrate, or
    # - remote path on Mattermost server (read over mattermost.ssh during upload mode).
    # local_data_path: "/opt/mattermost/data"
    
    # Maximum file size to upload to Matrix (in MB)
    # Files larger than this are treated as upload failures.
    # Only applies when mode is "upload"
    max_upload_size_mb: 50

    # Optional fallback for upload mode:
    # If true, failed uploads can be sent as links using s3_public_url.
    # If false (default), failed uploads are skipped and logged.
    fallback_to_link_on_upload_failure: false

# Matrix Synapse server configuration
matrix:
  # Leave `ssh` empty to use direct mode: the Matrix API is reached over `api.base_url`
  # without a tunnel. This is the normal setup for a homeserver behind an HTTPS ingress
  # (Kubernetes/Helm), where nothing listens on 127.0.0.1:8008 to forward to.
  #   ssh: {}
  ssh:
    host: "matrix.example.com"
    port: 22
    user: "root"
    
    # Authentication: Use ONE of the following options:
    
    # Option 1: SSH Key (recommended)
    key_path: "~/.ssh/id_rsa"
    # passphrase_env: "SSH_KEY_PASSPHRASE"  # Optional: if key is encrypted
    
    # Option 2: Password authentication
    # password_env: "MX_SSH_PASSWORD"  # Env var containing SSH password
  
  api:
    # After SSH tunnel, API will be available at localhost
    base_url: "http://localhost:8008"
    # Synapse API port on the remote server (default: 8008)
    # Change this if Synapse listens on a different port
    port: 8008
    # Optional: Use existing admin token instead of login
    # admin_token_env: "MATRIX_ADMIN_TOKEN"
  
  # Login with admin username/password (recommended)
  # The tool will automatically get an access token
  auth:
    username: "admin"
    password_env: "MATRIX_ADMIN_PASSWORD"
  
  # Your Matrix homeserver domain (e.g., for @user:example.com)
  homeserver: "example.com"
  
  # Rate limiting configuration (adjust if you get too many 429 errors)
  rate_limit:
    # Requests per second (lower = slower but safer, 0 = no limit)
    # Default: 5.0 (200ms between requests)
    requests_per_second: 5.0
    
    # Maximum retries when rate limited (429 error)
    # Default: 5
    max_retries: 5
    
    # Base delay in milliseconds for exponential backoff
    # Actual delay: base_delay * 2^retry_count (e.g., 2s, 4s, 8s, 16s, 32s)
    # Default: 2000 (2 seconds)
    retry_base_delay_ms: 2000
  
  # Application Service configuration (required for message import with timestamps and room creator/alias)
  # See appservice-registration.example.yaml and README for setup instructions.
  # For preserve_owner_and_alias you must set in the AS registration:
  #   namespaces.aliases: [ { exclusive: true, regex: "#.*:your\\.domain\\.com" } ]
  # (replace your.domain.com with your homeserver domain)
  appservice:
    # Enable Application Service mode for message import and for room/space creator + alias
    # This allows importing messages with their original timestamps and creating rooms as the actual owner
    enabled: false
    
    # Environment variable containing the AS token
    # Generate with: openssl rand -hex 32
    as_token_env: "MATRIX_AS_TOKEN"
    
    # Environment variable containing the HS token (optional)
    # hs_token_env: "MATRIX_HS_TOKEN"

  # Room/space import: preserve Mattermost owner and set local room address (team+name)
  import:
    # When true, rooms and spaces get: owner from channel/team creator_id (or fallback), alias = team+name
    preserve_owner_and_alias: false
    # When true, Mattermost direct message channels (D type) are exported and imported as Matrix DMs.
    # They show under "People" for both users. Requires Application Service (appservice.enabled) for setting m.direct.
    # import_direct_messages: false
    # When true (the default), emoji reactions are imported as Matrix m.reaction annotations
    # right after the messages they belong to, preserving author and timestamp via the
    # Application Service. Each reaction is one rate-limited API call, so set this to false to
    # trade the reactions for a shorter message import. Custom Mattermost emoji have no Matrix
    # equivalent and arrive as literal ":name:" text.
    # import_reactions: true
    # When true, users are added to rooms/spaces via Synapse admin API (joined directly, no invite to accept).
    # Use for migrations where users are already members. Default: false (invite; users must accept).
    # force_join: false
    # Public room join rules (who can join public Mattermost channels in Matrix). Default: "space_members"
    #   "space_members" - Only members of the parent space/team can join (restricted join rule; recommended).
    #   "public"        - Anyone can join (leave default Matrix join rule).
    # public_room_join_rules: "space_members"
    # Default visibility for Matrix spaces created from Mattermost teams. Default: "invite_only"
    #   "invite_only"     - Spaces are private/invite-only (recommended; matches Mattermost team behavior).
    #   "public"          - Spaces are public/joinable.
    #   "from_mattermost" - Derive from team type (O=public, I=invite-only).
    # space_visibility: "invite_only"
    # When creator_id is empty, use this Matrix username (localpart only, e.g. "admin" -> @admin:domain).
    # If this user does not exist, the admin account (auth.username) is used.
    # fallback_room_creator: "admin"

    # How a Mattermost account with delete_at > 0 is represented in Matrix. Either way the
    # account is still created, because the history needs it to attribute messages to, and
    # either way its messages stay in the room - neither mode redacts anything.
    #   "deactivated" (default) - Synapse's own account closure: no login, and the account is
    #                             removed from every room, which is what Synapse does to any
    #                             account being deactivated. The migration follows through:
    #                             deleted users are not added to rooms during membership
    #                             import, and 'import leave-rooms' removes any membership an
    #                             earlier run left behind.
    #   "locked"                - Synapse's reversible lock: no login, but room memberships are
    #                             kept, so the account still appears in member lists as it did
    #                             in Mattermost. Needs a Synapse new enough to accept "locked"
    #                             on the admin user API; older servers reject it and the
    #                             account is left unlocked.
    # deleted_user_mode: "deactivated"

    # How newly created Matrix users get a password.
    user_password:
      # "auto" (default) - no password when matrix.mas.enabled is true (accounts are
      #                    SSO-only), otherwise a random password per user.
      # "random"         - always generate a distinct random password per user.
      # "local_only"     - generate one only for users whose Mattermost account had no SSO
      #                    provider (auth_service empty), e.g. accounts created with mmctl.
      #                    Everyone else signs in through the upstream IdP. Requires
      #                    password login to be enabled on the homeserver, or in MAS
      #                    (passwords.enabled: true) - MAS otherwise answers set-password
      #                    with 403 and those accounts end up unreachable.
      # "none"           - never set a password; SSO or an admin-initiated reset only.
      mode: "auto"
      # Length of generated passwords. Default 24, valid range 12-128.
      length: 24
      # When true (default), generated passwords are written to
      # <assets_dir>/user-passwords-<timestamp>.csv with mode 0600 so you can distribute
      # them. That file is plaintext credentials - delete it once distributed.
      # Set false to discard generated passwords instead.
      write_file: true
    # For the room creator to be the actual user (not the AS admin), enable appservice above and set as_token_env.
    # In your Application Service registration you must include an alias namespace, e.g.:
    #   aliases: [ { exclusive: true, regex: "#.*:domain\\.com" } ]
    # If you get M_EXCLUSIVE, the tool will retry without alias so migration continues.

  # Matrix Authentication Service (MAS) - use MAS for user creation instead of Synapse
  # When enabled, users are created via MAS Admin API so they can log in via SSO/OAuth
  # without "Localpart not available" errors. Requires MAS with admin API enabled.
  mas:
    enabled: false
    
    # MAS API base URL (e.g. http://mas.example.com:8080 or http://localhost:8080 if tunneled)
    # endpoint: "http://mas.example.com:8080"
    
    # OAuth client credentials - must be an admin client in MAS policy.data.admin_clients
    # client_id_env: "MAS_CLIENT_ID"
    # client_secret_env: "MAS_CLIENT_SECRET"

# Data storage paths
data:
  assets_dir: "./data/assets"
  mappings_dir: "./data/mappings"
  state_file: "./data/state.json"


# ========================================
# SYNAPSE RATE LIMITING - IMPORTANT!
# ========================================
#
# If you're getting too many 429 (rate limit) errors during migration,
# you can TEMPORARILY disable rate limiting on your Synapse server:
#
# Add this to your homeserver.yaml (Synapse config):
#
#   rc_message:
#     per_second: 0
#     burst_count: 0
#   rc_registration:
#     per_second: 0
#     burst_count: 0
#   rc_login:
#     address:
#       per_second: 0
#       burst_count: 0
#     account:
#       per_second: 0
#       burst_count: 0
#     failed_attempts:
#       per_second: 0
#       burst_count: 0
#   rc_admin_redaction:
#     per_second: 0
#     burst_count: 0
#   rc_joins:
#     local:
#       per_second: 0
#       burst_count: 0
#     remote:
#       per_second: 0
#       burst_count: 0
#   rc_invites:
#     per_room:
#       per_second: 0
#       burst_count: 0
#     per_user:
#       per_second: 0
#       burst_count: 0
#
# IMPORTANT: Remember to restart Synapse and re-enable rate limiting
# after the migration is complete for security!
#
# To restart Synapse:
#   systemctl restart matrix-synapse  (or your docker command)
#

